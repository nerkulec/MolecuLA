program: scripts/wandb_run.py
method: bayes
metric:
  name: val/selection_loss
  goal: minimize

project: molecula-lignin-autoregressive-rosi
name: lignin-autoregressive-important-settings
command:
  - ${env}
  - python
  - -u
  - ${program}
  - ${args}

parameters:
  # W&B and paths. The logged-in entity/account is used automatically.
  wandb-project:
    value: molecula-lignin-autoregressive-rosi
  wandb-mode:
    value: online
  tokenizer:
    value: artifacts/lignin_retraining/unified_tokenizer.json
  shard-root:
    value: artifacts/lignin_retraining/encoded
  output-root:
    value: artifacts/lignin_retraining/sweeps/autoregressive
  log-checkpoint:
    value: true

  # Comparable compute budget for every trial.
  epochs:
    value: 5
  max-train-samples:
    value: 200000
  max-val-samples:
    value: 20000
  greedy-val-samples:
    value: 32
  save-every:
    value: 0
  num-workers:
    value: 4
  precision:
    value: bf16
  seed:
    value: 42

  # Eight high-impact architecture and optimization settings.
  learning-rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.001
  max-beta:
    distribution: log_uniform_values
    min: 0.003
    max: 0.06
  hidden-size:
    values: [256, 384, 512]
  latent-size:
    values: [256, 512, 1024]
  num-slots:
    values: [4, 8, 16]
  encoder-layers:
    values: [2, 3, 4]
  decoder-layers:
    values: [1, 2, 3]
  batch-size:
    values: [32, 64, 128]

  # Fixed because they are lower-priority than the settings above.
  attn-heads:
    value: 8
  weight-decay:
    value: 0.01
  beta-cycle-epochs:
    value: 10
  grad-clip:
    value: 1.0
